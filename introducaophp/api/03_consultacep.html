<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar CEP</title>
</head>
<body>
 
    <form action="03_consultacep.php" method="post">
        CEP: <input type="text" name="cep" id="cep" placeholder="00000-000" maxlength="9" required pattern="[0-9]{5}-?[0-9]{3}">
        <button type="submit">Consultar</button>
    </form>
    <script>
 
        // Máscara automática CEP
        const campoCep = document.getElementById("cep");
 
        campoCep.addEventListener("input", () => {
 
            let valor = campoCep.value;
 
            // Remove tudo que não for número
            valor = valor.replace(/\D/g, "");
 
            // Adiciona traço
            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
 
            campoCep.value = valor;
        });
 
    </script>
 
</body>
</html>

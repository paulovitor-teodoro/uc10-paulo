     <div class="container">
        <h1>Consulta de CEP</h1>
        
        <form action="03_consultacep.php" method="POST">
            
            <input type="text" 
                   name="cep" 
                   id="cep" 
                   placeholder="Digite o CEP (apenas números)" 
                   maxlength="8" 
                   pattern="\d{8}" 
                   title="O CEP deve conter exatamente 8 números." 
                   required>
                   
            <button type="submit">Consultar</button>
        </form>
    </div>
